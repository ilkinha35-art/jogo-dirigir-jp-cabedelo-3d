<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Dirigir JP & Cabedelo</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Cena e câmera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Rua (plano cinza)
    const roadGeometry = new THREE.PlaneGeometry(20, 100);
    const roadMaterial = new THREE.MeshBasicMaterial({color: 0x333333});
    const road = new THREE.Mesh(roadGeometry, roadMaterial);
    road.rotation.x = -Math.PI/2;
    scene.add(road);

    // Bordas da pista (brancas)
    const borderMaterial = new THREE.MeshBasicMaterial({color: 0xffffff});
    const leftBorder = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1, 100), borderMaterial);
    leftBorder.position.set(-10, 0.5, 0);
    scene.add(leftBorder);

    const rightBorder = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1, 100), borderMaterial);
    rightBorder.position.set(10, 0.5, 0);
    scene.add(rightBorder);

    // Ônibus (paralelepípedo vermelho)
    const busGeometry = new THREE.BoxGeometry(2, 2, 6);
    const busMaterial = new THREE.MeshBasicMaterial({color: 0xff0000});
    const bus = new THREE.Mesh(busGeometry, busMaterial);
    bus.position.y = 1;
    scene.add(bus);

    // Posição inicial da câmera
    camera.position.z = 20;
    camera.position.y = 5;

    // Controles de teclado
    const keys = {};
    window.addEventListener("keydown", (e) => { keys[e.key] = true; });
    window.addEventListener("keyup", (e) => { keys[e.key] = false; });

    function animate() {
      requestAnimationFrame(animate);

      // Movimento com setas
      if (keys["ArrowUp"]) bus.position.z -= 0.1;     // frente
      if (keys["ArrowDown"]) bus.position.z += 0.1;   // trás
      if (keys["ArrowLeft"]) bus.position.x -= 0.1;   // esquerda
      if (keys["ArrowRight"]) bus.position.x += 0.1;  // direita

      // Limites da pista
      if (bus.position.x < -9) bus.position.x = -9;
      if (bus.position.x > 9) bus.position.x = 9;

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
