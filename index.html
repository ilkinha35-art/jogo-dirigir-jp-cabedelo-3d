<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Dirigir JP & Cabedelo</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Cena e câmera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Luz ambiente
    const light = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(light);

    // Rua principal
    const roadGeometry = new THREE.PlaneGeometry(20, 100);
    const roadMaterial = new THREE.MeshBasicMaterial({color: 0x333333});
    const road = new THREE.Mesh(roadGeometry, roadMaterial);
    road.rotation.x = -Math.PI/2;
    scene.add(road);

    // Bordas da pista
    const borderMaterial = new THREE.MeshBasicMaterial({color: 0xffffff});
    const leftBorder = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1, 100), borderMaterial);
    leftBorder.position.set(-10, 0.5, 0);
    scene.add(leftBorder);

    const rightBorder = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1, 100), borderMaterial);
    rightBorder.position.set(10, 0.5, 0);
    scene.add(rightBorder);

    // Ônibus
    const busGeometry = new THREE.BoxGeometry(2, 2, 6);
    const busMaterial = new THREE.MeshBasicMaterial({color: 0xff0000});
    const bus = new THREE.Mesh(busGeometry, busMaterial);
    bus.position.y = 1;
    scene.add(bus);

    // Mapa simples (quarteirões ao lado da rua)
    const blockMaterial = new THREE.MeshBasicMaterial({color: 0x228B22}); // verde = quarteirão
    for (let i = -2; i <= 2; i++) {
      const block = new THREE.Mesh(new THREE.BoxGeometry(8, 1, 8), blockMaterial);
      block.position.set(-15, 0.5, i * 20);
      scene.add(block);

      const block2 = new THREE.Mesh(new THREE.BoxGeometry(8, 1, 8), blockMaterial);
      block2.position.set(15, 0.5, i * 20);
      scene.add(block2);
    }

    // Posição inicial da câmera
