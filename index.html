<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Dirigir JP & Cabedelo</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Cena e câmera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Luz ambiente
    const light = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(light);

    // Rua principal
    const roadGeometry = new THREE.PlaneGeometry(20, 100);
    const roadMaterial = new THREE.MeshBasicMaterial({color: 0x333333});
    const road = new THREE.Mesh(roadGeometry, roadMaterial);
    road.rotation.x = -Math.PI/2;
    scene.add(road);

    // Bordas da pista
    const borderMaterial = new THREE.MeshBasicMaterial({color: 0xffffff});
    const leftBorder = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1, 100), borderMaterial);
    leftBorder.position.set(-10, 0.5, 0);
    scene.add(leftBorder);

    const rightBorder = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1, 100), borderMaterial);
    rightBorder.position.set(10, 0.5, 0);
    scene.add(rightBorder);

    // Ônibus (jogador)
    const busGeometry = new THREE.BoxGeometry(2, 2, 6);
    const busMaterial = new THREE.MeshBasicMaterial({color: 0xff0000});
    const bus = new THREE.Mesh(busGeometry, busMaterial);
    bus.position.y = 1;
    scene.add(bus);

    // Semáforo
    const pole = new THREE.Mesh(new THREE.BoxGeometry(0.3, 5, 0.3), new THREE.MeshBasicMaterial({color: 0x555555}));
    pole.position.set(0, 2.5, -20);
    scene.add(pole);

    const lightRed = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshBasicMaterial({color: 0xff0000}));
    lightRed.position.set(0, 4.5, -20);
    scene.add(lightRed);

    const lightGreen = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshBasicMaterial({color: 0x00ff00}));
    lightGreen.position.set(0, 3.5, -20);
    scene.add(lightGreen);

    let greenLight = true;
    setInterval(() => {
      greenLight = !greenLight;
      lightGreen.material.color.set(greenLight ? 0x00ff00 : 0x222222);
      lightRed.material.color.set(greenLight ? 0x222222 : 0xff0000);
    }, 4000); // troca a cada 4 segundos

    // Carros NPC
    const npcCars = [];
    const npcMaterial = new THREE.MeshBasicMaterial({color: 0x0000ff});
    for (let i = 0; i < 3; i++) {
      const npc = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 4), npcMaterial);
      npc.position.set((i % 2 === 0 ? -5 : 5), 1, i * -15);
      scene.add(npc);
      npcCars.push(npc);
    }

    // Posição inicial da câmera
    camera.position.z = 20;
    camera.position.y = 8;
    camera.lookAt(bus.position);

    // Controles de teclado
    const keys = {};
    window.addEventListener("keydown", (e) => { keys[e.key] = true; });
    window.addEventListener("keyup", (e) => { keys[e.key] = false; });

    function animate() {
      requestAnimationFrame(animate);

      // Movimento do jogador
      if (keys["ArrowUp"]) bus.position.z -= 0.2;
      if (keys["ArrowDown"]) bus.position.z += 0.2;
      if (keys["ArrowLeft"]) bus.position.x -= 0.2;
      if (keys["ArrowRight"]) bus.position.x += 0.2;

      // Limites da pista
      if (bus.position.x < -9) bus.position.x = -9;
      if (bus.position.x > 9) bus.position.x = 9;
      if (bus.position.z < -48) bus.position.z = -48;
      if (bus.position.z > 48) bus.position.z = 48;

      // NPCs andando
      npcCars.forEach(npc => {
        if (greenLight) {
          npc.position.z += 0.05; // anda devagar
        }
      });

      // Colisão simples com NPCs
      npcCars.forEach(npc => {
        const dx = bus.position.x - npc.position.x;
        const dz = bus.position.z - npc.position.z;
        if (Math.abs(dx) < 2 && Math.abs(dz) < 4) {
          bus.position.z += 0.2; // empurra o jogador para trás
        }
      });

      // Câmera segue o ônibus
      camera.position.z = bus.position.z + 20;
      camera.position.x = bus.position.x;
      camera.lookAt(bus.position);

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
